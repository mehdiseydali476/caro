<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARO - Игровой Портал</title>
    <style>
        body {
            background-color: #0f172a;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            color: #38bdf8;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 900px;
        }
        .game-card {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.2s, border-color 0.2s;
        }
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #38bdf8;
        }
        .game-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }
        .game-card h2 {
            margin: 0 0 10px 0;
            color: #f8fafc;
        }
        .game-card p {
            font-size: 0.95rem;
            margin-bottom: 20px;
            flex-grow: 1;
        }
        .play-btn {
            background-color: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }
        .play-btn:hover {
            background-color: #0284c7;
            color: #fff;
        }
        .shooter-btn {
            background-color: #ef4444;
        }
        .shooter-btn:hover {
            background-color: #dc2626;
        }
        .shooter-card:hover {
            border-color: #ef4444;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎮 CARO Games Portal</h1>
        <p>Выбирай игру и начни играть прямо сейчас!</p>
    </header>

    <div class="games-grid">
        <!-- Карточка Snake -->
        <div class="game-card">
            <div class="game-icon">🐍</div>
            <h2>Snake Game</h2>
            <p>Классическая змейка с покупкой скинов, сохранением жизней и системой монет!</p>
            <a href="snake.html" class="play-btn">Играть в Snake</a>
        </div>

        <!-- Карточка 2D Shooter -->
        <div class="game-card shooter-card">
            <div class="game-icon">🎯</div>
            <h2>2D Shooter</h2>
            <p>Динамичный Top-Down шутер. Уничтожай волны врагов и прокачивай арсенал!</p>
            <a href="shooter.html" class="play-btn shooter-btn">Играть в Shooter</a>
        </div>
    </div>

</body>
</html>
