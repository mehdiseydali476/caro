<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARO - Game Portal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 40px 20px 20px;
            position: relative;
            width: 100%;
            box-sizing: border-box;
        }
        .user-panel {
            position: absolute;
            top: 20px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .nav-btn {
            padding: 8px 16px;
            background-color: #1e293b;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .auth-btn {
            padding: 8px 16px;
            background-color: #0284c7;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        h1 {
            font-size: 3rem;
            color: #38bdf8;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        p.subtitle { color: #94a3b8; font-size: 1.2rem; }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 1000px;
            margin-top: 30px;
        }
        .game-card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #334155;
            transition: transform 0.2s, border-color 0.2s;
        }
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #38bdf8;
        }
        .game-card h3 { margin-top: 0; color: #f1f5f9; }
        .game-card p { color: #94a3b8; font-size: 0.95rem; }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #0284c7;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="user-panel" id="userPanel">
            <!-- User panel content -->
        </div>
        <h1>CARO GAMES</h1>
        <p class="subtitle">Wanna play games? Come here!</p>
    </header>

    <div class="games-grid">
        <div class="game-card">
            <h3>🐍 Classic Snake</h3>
            <p>Control the snake, eat apples, and earn Snake Coins!</p>
            <a href="snake.html" class="btn">Play Now</a>
        </div>
    </div>

    <script>
        const currentUser = localStorage.getItem('caro_currentUser');
        const userPanel = document.getElementById('userPanel');

        let panelHTML = `<a href="shop.html" class="nav-btn">🛒 Market</a>`;

        if (currentUser) {
            panelHTML += `
                <span style="color: #38bdf8; font-weight: bold;">👤 ${currentUser}</span>
                <a href="#" class="auth-btn" onclick="logout()" style="background-color: #ef4444;">Logout</a>
            `;
        } else {
            panelHTML += `<a href="auth.html" class="auth-btn">Login / Register</a>`;
        }

        userPanel.innerHTML = panelHTML;

        function logout() {
            localStorage.removeItem('caro_currentUser');
            location.reload();
        }
    </script>
</body>
</html>
