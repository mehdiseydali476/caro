<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARO - Game Portal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 40px 20px 20px;
        }
        h1 {
            font-size: 3rem;
            color: #38bdf8;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 1.2rem;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 1000px;
            margin-top: 30px;
        }
        .game-card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #334155;
            transition: transform 0.2s, border-color 0.2s;
        }
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #38bdf8;
        }
        .game-card h3 {
            margin-top: 0;
            color: #f1f5f9;
        }
        .game-card p {
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #0284c7;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <header>
        <h1>CARO GAMES</h1>
        <p class="subtitle">Wanna play games? Come here!</p>
    </header>

    <div class="games-grid">
        <div class="game-card">
            <h3>🐍 Classic Snake</h3>
            <p>Control the snake, eat apples, and try not to hit the walls!</p>
            <a href="snake.html" class="btn">Play Now</a>
        </div>
    </div>

</body>
</html>
