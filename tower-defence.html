<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Tower Defense</title>
    <style>
        body {
            margin: 0;
            background: #1e1e1e;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }
        #ui {
            display: flex;
            gap: 20px;
            margin: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        #canvas-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        canvas {
            border: 2px solid #555;
            background: #2b2b2b;
            display: block;
        }
        .panel {
            display: flex;
            gap: 10px;
            margin: 10px;
            background: #333;
            padding: 10px;
            border-radius: 8px;
            align-items: center;
        }
        .btn {
            background: #444;
            color: #fff;
            border: 2px solid #666;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn:hover { background: #555; }
        .hint {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div id="ui">
    <div>База HP: <span id="base-hp" style="color: #ff5555;">100</span></div>
    <div>Игрок HP: <span id="player-hp" style="color: #55ff55;">100</span></div>
    <div>Монеты: <span id="money" style="color: #ffff55;">200</span>$</div>
    <div>Волна: <span id="wave-num" style="color: #ff9900;">1</span></div>
</div>

<div id="canvas-container">
    <canvas id="gameCanvas" width="960" height="540"></canvas>
</div>

<div class="hint">💡 **Двойной клик** по постройке повышает её уровень (Lvl) и характеристики!</div>

<div class="panel">
    <strong>Магазин построек:</strong>
    <button class="btn" onclick="selectItem('wall')">Стена ($30)</button>
    <button class="btn" onclick="selectItem('lava')">Лава ($50)</button>
    <button class="btn" onclick="selectItem('arrow')">Башня ($80)</button>
    <button class="btn" onclick="selectItem('aoe')">АоЕ ($120)</button>
    <button class="btn" onclick="selectItem('barracks')">Казарма ($150)</button>
    <button class="btn" style="background:#883333;" onclick="deselectItem()">Отмена</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const COLS = 16;
const ROWS = 9;
const CELL_SIZE = canvas.width / COLS;

let money = 200;
let gameOver = false;
let selectedBuilding = null;

const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

// Статы игрока из Маркета
const savedStats = JSON.parse(localStorage.getItem('playerUpgrades') || '{}');

const base = { hp: 100, maxHp: 100 };
const player = {
    x: CELL_SIZE * 2,
    y: canvas.height / 2,
    radius: 15,
    speed: 3 + (savedStats.speedBonus || 0),
    hp: 100 + (savedStats.hpBonus || 0),
    maxHp: 100 + (savedStats.hpBonus || 0),
    damage: 15 + (savedStats.dmgBonus || 0),
    attackRange: 160,
    attackCooldown: 0,
    attackRate: 20
};

const grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
const enemies = [];
const allies = [];
const bullets = [];

const COSTS = { wall: 30, lava: 50, arrow: 80, aoe: 120, barracks: 150 };

function selectItem(type) {
    if (money >= COSTS[type]) selectedBuilding = type;
    else alert("Недостаточно денег!");
}
function deselectItem() { selectedBuilding = null; }

canvas.addEventListener('click', (e) => {
    if (!selectedBuilding) return;
    const rect = canvas.getBoundingClientRect();
    const c = Math.floor((e.clientX - rect.left) / CELL_SIZE);
    const r = Math.floor((e.clientY - rect.top) / CELL_SIZE);

    if (c < 8 && !grid[r][c]) {
        money -= COSTS[selectedBuilding];
        grid[r][c] = createBuilding(selectedBuilding, r, c);
        selectedBuilding = null;
    }
});

// Двойной клик — УЛУЧШЕНИЕ ПОСТРОЙКИ (без починки HP)
canvas.addEventListener('dblclick', (e) => {
    const rect = canvas.getBoundingClientRect();
    const c = Math.floor((e.clientX - rect.left) / CELL_SIZE);
    const r = Math.floor((e.clientY - rect.top) / CELL_SIZE);

    const b = grid[r][c];
    if (b) {
        const upgradeCost = Math.round(COSTS[b.type] * 0.6);
        if (money >= upgradeCost) {
            money -= upgradeCost;
            b.level = (b.level || 1) + 1;
            b.maxHp += 50; // Увеличиваем макс. HP, но текущее HP не чиним!
            alert(`Постройка улучшена до ${b.level} ур.!`);
        } else {
            alert(`Для улучшения нужно $${upgradeCost}`);
        }
    }
});

function createBuilding(type, r, c) {
    const b = { type, r, c, x: c * CELL_SIZE, y: r * CELL_SIZE, hp: 100, maxHp: 100, timer: 0, level: 1 };
    if (type === 'wall') b.hp = b.maxHp = 250;
    if (type === 'barracks') b.hp = b.maxHp = 150;
    return b;
}

function updatePlayer() {
    if (keys['ArrowUp'] && player.y > player.radius) player.y -= player.speed;
    if (keys['ArrowDown'] && player.y < canvas.height - player.radius) player.y += player.speed;
    if (keys['ArrowLeft'] && player.x > player.radius) player.x -= player.speed;
    if (keys['ArrowRight'] && player.x < (canvas.width / 2) - player.radius) player.x += player.speed;

    if (player.attackCooldown > 0) player.attackCooldown--;
    else {
        let nearest = null;
        let minDist = player.attackRange;
        enemies.forEach(e => {
            const dist = Math.hypot(e.x - player.x, e.y - player.y);
            if (dist < minDist) { minDist = dist; nearest = e; }
        });

        if (nearest) {
            bullets.push({ x: player.x, y: player.y, target: nearest, speed: 7, damage: player.damage, color: '#00ffff' });
            player.attackCooldown = player.attackRate;
        }
    }
}

// Система волн и нарастающей сложности
let spawnTimer = 0;
let currentWave = 1;
let waveTimer = 0;

function spawnEnemies() {
    spawnTimer++;
    waveTimer++;

    // Каждые 30 секунд (1800 кадров при 60 FPS) наступает новая волна
    if (waveTimer % 1800 === 0) {
        currentWave++;
    }

    // Со временем интервал спавна уменьшается (от 110 до минимума 35 кадров)
    const spawnInterval = Math.max(35, 110 - (currentWave - 1) * 8);

    if (spawnTimer % Math.floor(spawnInterval) === 0) {
        const type = Math.floor(Math.random() * 4);
        const r = Math.floor(Math.random() * ROWS);

        // Множитель HP увеличивается на +15% за каждую новую волну
        const hpMultiplier = 1 + (currentWave - 1) * 0.15;

        let baseHp = 40;
        let baseReward = 15;
        let speed = 1;
        let targetType = 'base';

        if (type === 1) { speed = 1.8; baseHp = 25; baseReward = 10; targetType = 'player'; }
        if (type === 2) { speed = 0.6; baseHp = 110; baseReward = 35; }
        if (type === 3) { speed = 1.1; baseHp = 50; baseReward = 20; targetType = 'building'; }

        const scaledHp = Math.round(baseHp * hpMultiplier);

        const enemy = {
            x: canvas.width - 20,
            y: r * CELL_SIZE + CELL_SIZE / 2,
            type: type,
            speed: speed,
            hp: scaledHp,
            maxHp: scaledHp,
            reward: baseReward + Math.floor((currentWave - 1) * 2),
            targetType: targetType
        };

        enemies.push(enemy);
    }
}

function update() {
    if (gameOver) return;

    updatePlayer();
    spawnEnemies();

    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const b = grid[r][c];
            if (!b) continue;

            b.timer++;
            const lvlBonus = (b.level - 1) * 10;

            if (b.type === 'arrow' && b.timer % Math.max(15, 40 - lvlBonus) === 0) {
                let target = enemies.find(e => Math.hypot(e.x - (b.x + 30), e.y - (b.y + 30)) < 200);
                if (target) bullets.push({ x: b.x + 30, y: b.y + 30, target, speed: 6, damage: 20 + lvlBonus, color: '#ffff00' });
            }
            if (b.type === 'aoe' && b.timer % 140 === 0) {
                enemies.forEach(e => {
                    if (Math.hypot(e.x - (b.x + 30), e.y - (b.y + 30)) < 120 + lvlBonus) e.hp -= (35 + lvlBonus);
                });
            }
            if (b.type === 'barracks' && b.timer % Math.max(120, 280 - lvlBonus * 10) === 0) {
                allies.push({ x: b.x + 60, y: b.y + 30, speed: 1.2, hp: 35 + lvlBonus, damage: 12 + lvlBonus });
            }
        }
    }

    allies.forEach((a, i) => {
        a.x += a.speed;
        enemies.forEach(e => {
            if (Math.hypot(e.x - a.x, e.y - a.y) < 20) {
                e.hp -= a.damage;
                a.hp -= 10;
            }
        });
        if (a.hp <= 0 || a.x > canvas.width) allies.splice(i, 1);
    });

    enemies.forEach((e, i) => {
        const curR = Math.floor(e.y / CELL_SIZE);
        const curC = Math.floor(e.x / CELL_SIZE);

        if (grid[curR] && grid[curR][curC] && grid[curR][curC].type === 'lava') {
            const lavaLvl = grid[curR][curC].level || 1;
            e.hp -= 0.4 * lavaLvl;
        }

        let targetX = 0, targetY = e.y;
        if (e.targetType === 'player') { targetX = player.x; targetY = player.y; }

        const angle = Math.atan2(targetY - e.y, targetX - e.x);
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;

        if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + 10) {
            player.hp -= 0.25;
        }

        if (grid[curR] && grid[curR][curC] && grid[curR][curC].type !== 'lava') {
            grid[curR][curC].hp -= 0.5;
            if (grid[curR][curC].hp <= 0) grid[curR][curC] = null;
        }

        if (e.x <= CELL_SIZE) {
            base.hp -= 10;
            enemies.splice(i, 1);
            return;
        }

        if (e.hp <= 0) {
            money += e.reward;
            enemies.splice(i, 1);
        }
    });

    bullets.forEach((b, i) => {
        if (!b.target || b.target.hp <= 0) { bullets.splice(i, 1); return; }
        const angle = Math.atan2(b.target.y - b.y, b.target.x - b.x);
        b.x += Math.cos(angle) * b.speed;
        b.y += Math.sin(angle) * b.speed;

        if (Math.hypot(b.target.x - b.x, b.target.y - b.y) < 10) {
            b.target.hp -= b.damage;
            bullets.splice(i, 1);
        }
    });

    if (base.hp <= 0 || player.hp <= 0) gameOver = true;

    document.getElementById('base-hp').innerText = Math.max(0, Math.ceil(base.hp));
    document.getElementById('player-hp').innerText = Math.max(0, Math.ceil(player.hp));
    document.getElementById('money').innerText = money;
    document.getElementById('wave-num').innerText = currentWave;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#3a3a3a';
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            ctx.strokeRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
        }
    }

    ctx.strokeStyle = '#555';
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 0);
    ctx.lineTo(canvas.width / 2, canvas.height);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#aa2222';
    ctx.fillRect(0, 0, 15, canvas.height);

    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const b = grid[r][c];
            if (!b) continue;
            if (b.type === 'wall') ctx.fillStyle = '#777777';
            if (b.type === 'lava') ctx.fillStyle = '#ff4400';
            if (b.type === 'arrow') ctx.fillStyle = '#22aa55';
            if (b.type === 'aoe') ctx.fillStyle = '#aa22aa';
            if (b.type === 'barracks') ctx.fillStyle = '#2255aa';

            ctx.fillRect(b.x + 2, b.y + 2, CELL_SIZE - 4, CELL_SIZE - 4);

            if (b.level > 1) {
                ctx.fillStyle = '#ffffff';
                ctx.font = '12px sans-serif';
                ctx.fillText(`Lvl ${b.level}`, b.x + 5, b.y + 15);
            }

            if (b.type !== 'lava') {
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(b.x + 5, b.y + CELL_SIZE - 10, CELL_SIZE - 10, 4);
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(b.x + 5, b.y + CELL_SIZE - 10, (CELL_SIZE - 10) * Math.max(0, (b.hp / b.maxHp)), 4);
            }
        }
    }

    // Игрок
    ctx.fillStyle = '#00ffcc';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fill();

    // Союзники
    ctx.fillStyle = '#3388ff';
    allies.forEach(a => {
        ctx.beginPath();
        ctx.arc(a.x, a.y, 8, 0, Math.PI * 2);
        ctx.fill();
    });

    // Отрисовка мобов и их HP баров
    enemies.forEach(e => {
        const radius = e.type === 2 ? 16 : 10;

        if (e.type === 0) ctx.fillStyle = '#ff3333';
        if (e.type === 1) ctx.fillStyle = '#ff9900';
        if (e.type === 2) ctx.fillStyle = '#880000';
        if (e.type === 3) ctx.fillStyle = '#ffff00';

        ctx.beginPath();
        ctx.arc(e.x, e.y, radius, 0, Math.PI * 2);
        ctx.fill();

        // Шкала HP над головой бота
        const barWidth = 26;
        const barHeight = 4;
        const barX = e.x - barWidth / 2;
        const barY = e.y - radius - 8;

        ctx.fillStyle = '#ff0000';
        ctx.fillRect(barX, barY, barWidth, barHeight);
        ctx.fillStyle = '#00ff00';
        ctx.fillRect(barX, barY, barWidth * Math.max(0, (e.hp / e.maxHp)), barHeight);
    });

    bullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
    });

    if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff3333';
        ctx.font = '48px sans-serif';
        ctx.fillText('ИГРА ОКОНЧЕНА', canvas.width / 2 - 180, canvas.height / 2);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
