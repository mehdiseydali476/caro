<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Defense</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e24;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        #game-container {
            position: relative;
        }

        canvas {
            border: 2px solid #444;
            background-color: #2b2b36;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        #ui {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .btn {
            padding: 8px 16px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div>Волна: <span id="wave">1</span></div>
        <div>Здоровье: <span id="health">20</span></div>
        <div>Монеты: <span id="gold">100</span></div>
        <button class="btn" onclick="startNextWave()">Следующая волна</button>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Игровое состояние
        let wave = 1;
        let health = 20;
        let gold = 100;
        let isWaveActive = false;

        // Путь для врагов (точки)
        const path = [
            {x: 0, y: 100},
            {x: 200, y: 100},
            {x: 200, y: 400},
            {x: 500, y: 400},
            {x: 500, y: 200},
            {x: 800, y: 200}
        ];

        // Массивы объектов
        const towers = [];
        const enemies = [];
        const bullets = [];

        // Класс Башни
        class Tower {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.range = 120;
                this.damage = 25;
                this.cooldown = 0;
                this.fireRate = 30; // кадров между выстрелами
            }

            draw() {
                ctx.fillStyle = '#3498db';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 20, 0, Math.PI * 2);
                ctx.fill();

                // Отрисовка радиуса при наведении/покупке
                ctx.strokeStyle = 'rgba(52, 152, 219, 0.2)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.range, 0, Math.PI * 2);
                ctx.stroke();
            }

            update() {
                if (this.cooldown > 0) this.cooldown--;

                // Поиск ближайшего врага в радиусе
                for (let enemy of enemies) {
                    const dist = Math.hypot(enemy.x - this.x, enemy.y - this.y);
                    if (dist < this.range && this.cooldown === 0) {
                        bullets.push(new Bullet(this.x, this.y, enemy, this.damage));
                        this.cooldown = this.fireRate;
                        break;
                    }
                }
            }
        }

        // Класс Врага (с поддержкой увеличения сложности)
        class Enemy {
            constructor(waveNumber, isBoss = false) {
                this.pathIndex = 0;
                this.x = path[0].x;
                this.y = path[0].y;
                this.isBoss = isBoss;

                // Увеличение сложностей с волнами
                const hpScale = Math.pow(1.25, waveNumber - 1);
                this.maxHp = Math.round((isBoss ? 500 : 80) * hpScale);
                this.hp = this.maxHp;
                this.speed = isBoss ? 1.0 : Math.min(1.5 + waveNumber * 0.05, 3.5);
                this.reward = Math.round((isBoss ? 100 : 15) * (1 + waveNumber * 0.1));
                this.radius = isBoss ? 22 : 12;
            }

            draw() {
                // Шкала здоровья
                ctx.fillStyle = 'red';
                ctx.fillRect(this.x - 15, this.y - this.radius - 8, 30, 4);
                ctx.fillStyle = 'green';
                ctx.fillRect(this.x - 15, this.y - this.radius - 8, (30 * this.hp) / this.maxHp, 4);

                // Тело врага
                ctx.fillStyle = this.isBoss ? '#e74c3c' : '#e67e22';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            update() {
                const target = path[this.pathIndex + 1];
                if (!target) return;

                const dx = target.x - this.x;
                const dy = target.y - this.y;
                const dist = Math.hypot(dx, dy);

                if (dist < this.speed) {
                    this.x = target.x;
                    this.y = target.y;
                    this.pathIndex++;
                    if (this.pathIndex >= path.length - 1) {
                        // Враг дошел до конца
                        health -= this.isBoss ? 5 : 1;
                        this.hp = 0; // пометить на удаление
                        updateUI();
                    }
                } else {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }
            }
        }

        // Класс Снаряда
        class Bullet {
            constructor(x, y, target, damage) {
                this.x = x;
                this.y = y;
                this.target = target;
                this.damage = damage;
                this.speed = 7;
            }

            draw() {
                ctx.fillStyle = '#f1c40f';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            update() {
                const dx = this.target.x - this.x;
                const dy = this.target.y - this.y;
                const dist = Math.hypot(dx, dy);

                if (dist < this.speed) {
                    this.target.hp -= this.damage;
                    if (this.target.hp <= 0 && enemies.includes(this.target)) {
                        gold += this.target.reward;
                        updateUI();
                    }
                    return true; // снаряд попал
                }

                this.x += (dx / dist) * this.speed;
                this.y += (dy / dist) * this.speed;
                return false;
            }
        }

        // Старт волны
        function startNextWave() {
            if (isWaveActive) return;
            isWaveActive = true;

            let enemiesToSpawn = 5 + (wave * 2);
            let spawned = 0;
            let spawnInterval = Math.max(300, 1000 - (wave * 40));

            const interval = setInterval(() => {
                spawned++;
                const isBoss = (wave % 5 === 0) && (spawned === enemiesToSpawn);
                enemies.push(new Enemy(wave, isBoss));

                if (spawned >= enemiesToSpawn) {
                    clearInterval(interval);
                }
            }, spawnInterval);
        }

        function updateUI() {
            document.getElementById('wave').innerText = wave;
            document.getElementById('health').innerText = Math.max(0, health);
            document.getElementById('gold').innerText = gold;
        }

        // Установка башни по клику
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Стоимость башни = 50
            if (gold >= 50) {
                towers.push(new Tower(x, y));
                gold -= 50;
                updateUI();
            }
        });

        // Отрисовка дороги
        function drawPath() {
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 30;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.stroke();
        }

        // Главный игровой цикл
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawPath();

            // Обновление и отрисовка башен
            towers.forEach(tower => {
                tower.update();
                tower.draw();
            });

            // Обновление и отрисовка врагов
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                enemy.update();
                enemy.draw();
                if (enemy.hp <= 0) {
                    enemies.splice(i, 1);
                }
            }

            // Обновление и отрисовка пуль
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                if (bullet.update()) {
                    bullets.splice(i, 1);
                } else {
                    bullet.draw();
                }
            }

            // Проверка завершения волны
            if (isWaveActive && enemies.length === 0) {
                isWaveActive = false;
                wave++;
                gold += 20 + wave * 5; // Бонус за завершение волны
                updateUI();
            }

            if (health > 0) {
                requestAnimationFrame(gameLoop);
            } else {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
            }
        }

        gameLoop();
    </script>
</body>
</html>
