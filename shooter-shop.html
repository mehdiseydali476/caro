<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARO - Shooter Market</title>
    <style>
        body {
            background-color: #0f172a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #eab308; font-size: 2.2rem; margin-bottom: 10px; }
        
        .shop-container {
            background-color: #1e293b;
            border: 2px solid #eab308;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            text-align: center;
        }
        .shop-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .nav-links { margin-top: 25px; }
        .nav-btn {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
            padding: 8px 16px;
            border: 1px solid #38bdf8;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .nav-btn:hover { background-color: #38bdf8; color: #0f172a; }
    </style>
</head>
<body>

    <header>
        <h1>🛒 Shooter Market</h1>
    </header>

    <div class="shop-container">
        <div class="shop-grid" id="shopList">
            <p style="color: #94a3b8;">Магазин пока пуст.</p>
        </div>
    </div>

    <div class="nav-links">
        <a href="shooter.html" class="nav-btn">← Назад к режимам</a>
    </div>

</body>
</html>
