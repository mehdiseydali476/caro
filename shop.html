<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARO - Market</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 30px 20px 10px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        .currency-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }
        .badge {
            background-color: #1e293b;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 900px;
            margin-top: 30px;
        }
        .item-card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #334155;
            transition: transform 0.2s;
        }
        .item-card:hover { transform: translateY(-3px); }
        .item-card h3 { margin-top: 0; color: #f1f5f9; }
        .item-card p { color: #94a3b8; font-size: 0.9rem; }
        .buy-btn {
            margin-top: 10px;
            padding: 10px 18px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .buy-btn:hover { background-color: #0369a1; }
        .buy-btn:disabled { background-color: #475569; cursor: not-allowed; }
        .back-link { margin-top: 30px; color: #38bdf8; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>CARO Market 🛒</h1>
        <div class="currency-container">
            <div class="badge">🐍 Snake Blue Coins: <span id="snakeCoins">0</span> 🔵</div>
        </div>
    </header>

    <div class="shop-grid">
        <div class="item-card">
            <h3>🟢 Neon Green Skin</h3>
            <p>Classic Snake Body Color</p>
            <button class="buy-btn" id="btn_green" onclick="selectSkin('green')">Equipped</button>
        </div>
        <div class="item-card">
            <h3>🔵 Cyan Speedster Skin</h3>
            <p>Changes Snake Body to Cyan</p>
            <button class="buy-btn" id="btn_cyan" onclick="buyOrSelect('cyan', 50)">Buy (50 🔵)</button>
        </div>
        <div class="item-card">
            <h3>🟣 Purple Phantom Skin</h3>
            <p>Changes Snake Body to Purple</p>
            <button class="buy-btn" id="btn_purple" onclick="buyOrSelect('purple', 100)">Buy (100 🔵)</button>
        </div>
    </div>

    <a href="index.html" class="back-link">← Back to Home Page</a>

    <script>
        let snakeCoins = parseInt(localStorage.getItem('caro_snake_coins') || '0');
        let ownedSkins = JSON.parse(localStorage.getItem('caro_owned_skins') || '["green"]');
        let currentSkin = localStorage.getItem('caro_active_skin') || 'green';

        function updateUI() {
            document.getElementById('snakeCoins').innerText = snakeCoins;

            ['green', 'cyan', 'purple'].forEach(skin => {
                const btn = document.getElementById('btn_' + skin);
                if (!btn) return;

                if (currentSkin === skin) {
                    btn.innerText = 'Equipped';
                    btn.disabled = true;
                    btn.style.backgroundColor = '#22c55e';
                } else if (ownedSkins.includes(skin)) {
                    btn.innerText = 'Select';
                    btn.disabled = false;
                    btn.style.backgroundColor = '#0284c7';
                }
            });
        }

        function buyOrSelect(skin, price) {
            if (ownedSkins.includes(skin)) {
                selectSkin(skin);
            } else {
                if (snakeCoins >= price) {
                    snakeCoins -= price;
                    ownedSkins.push(skin);
                    currentSkin = skin;

                    localStorage.setItem('caro_snake_coins', snakeCoins);
                    localStorage.setItem('caro_owned_skins', JSON.stringify(ownedSkins));
                    localStorage.setItem('caro_active_skin', currentSkin);

                    updateUI();
                    alert('Skin purchased and equipped!');
                } else {
                    alert('Not enough Blue Coins!');
                }
            }
        }

        function selectSkin(skin) {
            currentSkin = skin;
            localStorage.setItem('caro_active_skin', currentSkin);
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
