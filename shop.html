<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARO - Market</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 30px 20px 10px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        .currency-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }
        .badge {
            background-color: #1e293b;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 900px;
            margin-top: 30px;
        }
        .empty-market {
            grid-column: 1 / -1;
            text-align: center;
            color: #94a3b8;
            font-size: 1.2rem;
            margin-top: 40px;
        }
        .back-link { margin-top: 30px; color: #38bdf8; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>CARO Market 🛒</h1>
        <div class="currency-container">
            <div class="badge">🐍 Snake Coins: <span id="snakeCoins">0</span> 🔵</div>
        </div>
    </header>

    <div class="shop-grid">
        <div class="empty-market">
            <p>Market is empty right now. New items coming soon!</p>
        </div>
    </div>

    <a href="index.html" class="back-link">← Back to Home Page</a>

    <script>
        const snakeCoins = parseInt(localStorage.getItem('caro_snake_coins') || '0');
        document.getElementById('snakeCoins').innerText = snakeCoins;
    </script>
</body>
</html>
