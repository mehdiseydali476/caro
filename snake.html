<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARO - Snake Game</title>
    <style>
        body {
            background-color: #0f172a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 { color: #22c55e; margin-bottom: 10px; }
        .score-board {
            display: flex;
            gap: 20px;
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #94a3b8;
        }
        .score-board span { font-weight: bold; }
        .coins-text { color: #22c55e !important; }
        .lives-text { color: #ef4444 !important; }
        canvas {
            border: 2px solid #22c55e;
            background-color: #1e293b;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .back-btn {
            margin-top: 20px;
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Snake Game</h1>
    <div class="score-board">
        <div>Score: <span id="score" style="color:#38bdf8">0</span></div>
        <div>Lives: <span id="lives" class="lives-text">1</span> ❤️</div>
        <div>Coins: 🟢 <span id="coins" class="coins-text">0</span></div>
    </div>
    <canvas id="game" width="400" height="400"></canvas>
    <a href="index.html" class="back-btn">← Back to Main Page</a>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const grid = 20;

        // Чем меньше speedMs, тем БЫСТРЕЕ двигается змейка.
        // Скорость 50 = 60ms (очень быстрая), Скорость 30 = 120ms (плавная/медленная)
        const skinsConfig = {
            'skin_1': { speedMs: 60,  maxLives: 1, color: '#22c55e' }, // Speed 50
            'skin_2': { speedMs: 75,  maxLives: 2, color: '#10b981' }, // Speed 45
            'skin_3': { speedMs: 90,  maxLives: 3, color: '#84cc16' }, // Speed 40
            'skin_4': { speedMs: 105, maxLives: 4, color: '#eab308' }, // Speed 35
            'skin_5': { speedMs: 120, maxLives: 5, color: '#06b6d4' }  // Speed 30
        };

        const activeSkinId = localStorage.getItem('caro_active_skin') || 'skin_1';
        const currentSkin = skinsConfig[activeSkinId] || skinsConfig['skin_1'];

        let lastRenderTime = 0;
        let score = 0;
        let pendingScore = 0;
        let lives = currentSkin.maxLives;
        let greenCoins = parseInt(localStorage.getItem('caro_snake_coins') || '0');

        document.getElementById('coins').innerText = greenCoins;
        document.getElementById('lives').innerText = lives;

        let snake = {
            x: 160,
            y: 160,
            dx: grid,
            dy: 0,
            cells: [],
            maxCells: 4
        };

        let apple = { x: 320, y: 320 };

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min)) + min;
        }

        function resetSnake() {
            snake.x = 160;
            snake.y = 160;
            snake.cells = [];
            snake.maxCells = 4;
            snake.dx = grid;
            snake.dy = 0;
            pendingScore = 0;
        }

        function checkCoinRewards() {
            let coinsAwarded = 0;

            while (pendingScore >= 500) {
                coinsAwarded += 100;
                pendingScore -= 500;
            }
            while (pendingScore >= 250) {
                coinsAwarded += 50;
                pendingScore -= 250;
            }
            while (pendingScore >= 150) {
                coinsAwarded += 20;
                pendingScore -= 150;
            }

            if (coinsAwarded > 0) {
                greenCoins += coinsAwarded;
                localStorage.setItem('caro_snake_coins', greenCoins);
                document.getElementById('coins').innerText = greenCoins;
            }
        }

        function gameLoop(currentTime) {
            window.requestAnimationFrame(gameLoop);

            const secondsSinceLastRender = (currentTime - lastRenderTime) / 1000;
            if (secondsSinceLastRender < currentSkin.speedMs / 1000) return;

            lastRenderTime = currentTime;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            snake.x += snake.dx;
            snake.y += snake.dy;

            if (snake.x < 0) snake.x = canvas.width - grid;
            else if (snake.x >= canvas.width) snake.x = 0;
            
            if (snake.y < 0) snake.y = canvas.height - grid;
            else if (snake.y >= canvas.height) snake.y = 0;

            snake.cells.unshift({x: snake.x, y: snake.y});

            if (snake.cells.length > snake.maxCells) {
                snake.cells.pop();
            }

            // Яблоко
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(apple.x, apple.y, grid - 1, grid - 1);

            // Змейка
            snake.cells.forEach((cell, index) => {
                ctx.fillStyle = currentSkin.color;
                ctx.fillRect(cell.x, cell.y, grid - 1, grid - 1);

                // Поедание яблока
                if (cell.x === apple.x && cell.y === apple.y) {
                    snake.maxCells++;
                    const pointsGained = 10;
                    score += pointsGained;
                    pendingScore += pointsGained;

                    checkCoinRewards();

                    document.getElementById('score').innerText = score;

                    apple.x = getRandomInt(0, 20) * grid;
                    apple.y = getRandomInt(0, 20) * grid;
                }

                // Столкновения
                for (let i = index + 1; i < snake.cells.length; i++) {
                    if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
                        lives--;
                        document.getElementById('lives').innerText = lives;

                        if (lives <= 0) {
                            alert('Game Over!');
                            lives = currentSkin.maxLives;
                            document.getElementById('lives').innerText = lives;
                            score = 0;
                            document.getElementById('score').innerText = score;
                        }
                        resetSnake();
                        apple.x = getRandomInt(0, 20) * grid;
                        apple.y = getRandomInt(0, 20) * grid;
                    }
                }
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
            else if (e.key === 'ArrowUp' && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; }
            else if (e.key === 'ArrowRight' && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
            else if (e.key === 'ArrowDown' && snake.dy === 0) { snake.dx = 0; snake.dy = grid; }
        });

        window.requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
