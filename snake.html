<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARO - Snake Game</title>
    <style>
        body {
            background-color: #0f172a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }
        h1 { color: #22c55e; margin-bottom: 10px; }
        .score-board {
            display: flex;
            gap: 20px;
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #94a3b8;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        .score-board span { font-weight: bold; }
        .coins-text { color: #22c55e !important; }
        .lives-text { color: #ef4444 !important; }
        .highscore-text { color: #eab308 !important; }
        canvas {
            border: 2px solid #22c55e;
            background-color: #1e293b;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .nav-links {
            margin-top: 20px;
            display: flex;
            gap: 20px;
        }
        .nav-btn {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
            padding: 8px 16px;
            border: 1px solid #38bdf8;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .nav-btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }

        /* Встроенный Маркет */
        .shop-container {
            margin-top: 25px;
            background-color: #1e293b;
            border: 2px solid #eab308;
            border-radius: 12px;
            padding: 20px;
            width: 400px;
            box-sizing: border-box;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        .shop-title {
            color: #eab308;
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
        }
        .shop-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0f172a;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .item-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .skin-color-preview {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            display: inline-block;
        }
        .item-btn {
            background-color: #eab308;
            color: #0f172a;
            border: none;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .item-btn:hover {
            background-color: #ca8a04;
            color: #fff;
        }
        .item-btn.active {
            background-color: #22c55e;
            color: #0f172a;
            cursor: default;
        }
        .item-btn.disabled {
            background-color: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>Snake Game</h1>
    <div class="score-board">
        <div>Score: <span id="score" style="color:#38bdf8">0</span></div>
        <div>High Score: <span id="highScore" class="highscore-text">0</span></div>
        <div>Lives: <span id="lives" class="lives-text">1</span> ❤️</div>
        <div>Coins: 🟢 <span id="coins" class="coins-text">0</span></div>
    </div>
    
    <canvas id="game" width="400" height="400"></canvas>

    <!-- Встроенный Маркет Скинов -->
    <div class="shop-container">
        <h3 class="shop-title">🛒 Магазин Скинов</h3>
        <div class="shop-grid" id="shopList"></div>
    </div>

    <div class="nav-links">
        <a href="index.html" class="nav-btn">← Main Menu</a>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const grid = 20;

        const skinsConfig = [
            { id: 'skin_1', name: 'Классик (1 жизнь)', price: 0, speedMs: 60, maxLives: 1, color: '#22c55e', headColor: '#4ade80' },
            { id: 'skin_2', name: 'Изумруд (2 жизни)', price: 100, speedMs: 75, maxLives: 2, color: '#10b981', headColor: '#34d399' },
            { id: 'skin_3', name: 'Лайм (3 жизни)', price: 250, speedMs: 90, maxLives: 3, color: '#84cc16', headColor: '#a3e635' },
            { id: 'skin_4', name: 'Золото (4 жизни)', price: 500, speedMs: 105, maxLives: 4, color: '#eab308', headColor: '#fde047' },
            { id: 'skin_5', name: 'Кибер (5 жизней)', price: 1000, speedMs: 120, maxLives: 5, color: '#06b6d4', headColor: '#67e8f9' }
        ];

        let ownedSkins = JSON.parse(localStorage.getItem('caro_owned_skins') || '["skin_1"]');
        let activeSkinId = localStorage.getItem('caro_active_skin') || 'skin_1';
        let currentSkin = skinsConfig.find(s => s.id === activeSkinId) || skinsConfig[0];

        let lastRenderTime = 0;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('caro_snake_highscore') || '0');
        let pendingScore = 0;
        let lives = currentSkin.maxLives;
        let greenCoins = parseInt(localStorage.getItem('caro_snake_coins') || '0');

        document.getElementById('coins').innerText = greenCoins;
        document.getElementById('lives').innerText = lives;
        document.getElementById('highScore').innerText = highScore;

        let snake = { x: 160, y: 160, dx: grid, dy: 0, cells: [], maxCells: 4 };
        let nextDx = grid;
        let nextDy = 0;
        let apple = { x: 320, y: 320 };

        function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min)) + min; }

        function spawnApple() {
            let valid = false;
            while (!valid) {
                apple.x = getRandomInt(0, 20) * grid;
                apple.y = getRandomInt(0, 20) * grid;
                valid = !snake.cells.some(cell => cell.x === apple.x && cell.y === apple.y);
            }
        }

        function respawnSnake() {
            snake.x = 160;
            snake.y = 160;
            snake.dx = grid;
            snake.dy = 0;
            nextDx = grid;
            nextDy = 0;
            const currentLen = snake.maxCells;
            snake.cells = [];
            for (let i = 0; i < currentLen; i++) {
                snake.cells.push({ x: 160 - (i * grid), y: 160 });
            }
        }

        function renderShop() {
            const list = document.getElementById('shopList');
            list.innerHTML = '';

            skinsConfig.forEach(skin => {
                const isOwned = ownedSkins.includes(skin.id);
                const isActive = activeSkinId === skin.id;

                const item = document.createElement('div');
                item.className = 'shop-item';
                item.innerHTML = `
                    <div class="item-info">
                        <span class="skin-color-preview" style="background:${skin.color}"></span>
                        <span>${skin.name}</span>
                    </div>
                    <div>
                        ${isActive ? `<button class="item-btn active">Выбран</button>` : 
                          isOwned ? `<button class="item-btn" onclick="selectSkin('${skin.id}')">Надеть</button>` :
                          `<button class="item-btn ${greenCoins < skin.price ? 'disabled' : ''}" onclick="buySkin('${skin.id}', ${skin.price})">Купить (${skin.price} 🟢)</button>`}
                    </div>
                `;
                list.appendChild(item);
            });
        }

        window.selectSkin = function(id) {
            activeSkinId = id;
            localStorage.setItem('caro_active_skin', id);
            currentSkin = skinsConfig.find(s => s.id === id);
            lives = currentSkin.maxLives;
            document.getElementById('lives').innerText = lives;
            renderShop();
        };

        window.buySkin = function(id, price) {
            if (greenCoins >= price) {
                greenCoins -= price;
                localStorage.setItem('caro_snake_coins', greenCoins);
                document.getElementById('coins').innerText = greenCoins;

                ownedSkins.push(id);
                localStorage.setItem('caro_owned_skins', JSON.stringify(ownedSkins));
                selectSkin(id);
            }
        };

        function checkCoinRewards() {
            let coinsAwarded = 0;
            while (pendingScore >= 500) { coinsAwarded += 100; pendingScore -= 500; }
            while (pendingScore >= 250) { coinsAwarded += 50;  pendingScore -= 250; }
            while (pendingScore >= 150) { coinsAwarded += 20;  pendingScore -= 150; }

            if (coinsAwarded > 0) {
                greenCoins += coinsAwarded;
                localStorage.setItem('caro_snake_coins', greenCoins);
                document.getElementById('coins').innerText = greenCoins;
                renderShop();
            }
        }

        function updateHighScore() {
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('caro_snake_highscore', highScore);
                document.getElementById('highScore').innerText = highScore;
            }
        }

        function gameLoop(currentTime) {
            window.requestAnimationFrame(gameLoop);

            const secondsSinceLastRender = (currentTime - lastRenderTime) / 1000;
            if (secondsSinceLastRender < currentSkin.speedMs / 1000) return;

            lastRenderTime = currentTime;
            snake.dx = nextDx;
            snake.dy = nextDy;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            snake.x += snake.dx;
            snake.y += snake.dy;

            if (snake.x < 0) snake.x = canvas.width - grid;
            else if (snake.x >= canvas.width) snake.x = 0;
            
            if (snake.y < 0) snake.y = canvas.height - grid;
            else if (snake.y >= canvas.height) snake.y = 0;

            snake.cells.unshift({x: snake.x, y: snake.y});

            if (snake.cells.length > snake.maxCells) {
                snake.cells.pop();
            }

            let hitSelf = false;
            for (let i = 1; i < snake.cells.length; i++) {
                if (snake.cells[0].x === snake.cells[i].x && snake.cells[0].y === snake.cells[i].y) {
                    hitSelf = true;
                    break;
                }
            }

            if (hitSelf) {
                lives--;
                document.getElementById('lives').innerText = lives;

                if (lives <= 0) {
                    lives = currentSkin.maxLives;
                    score = 0;
                    pendingScore = 0;
                    snake.maxCells = 4;
                    document.getElementById('lives').innerText = lives;
                    document.getElementById('score').innerText = score;
                }

                respawnSnake();
                spawnApple();
                return;
            }

            ctx.fillStyle = '#ef4444';
            ctx.fillRect(apple.x, apple.y, grid - 1, grid - 1);

            snake.cells.forEach((cell, index) => {
                const isHead = index === 0;

                ctx.fillStyle = isHead ? currentSkin.headColor : currentSkin.color;
                ctx.fillRect(cell.x, cell.y, grid - 1, grid - 1);

                if (isHead) {
                    ctx.fillStyle = '#000';
                    let eyeX = cell.x + 10;
                    let eyeY = cell.y + 10;

                    if (snake.dx > 0) { eyeX = cell.x + 13; eyeY = cell.y + 6; }
                    else if (snake.dx < 0) { eyeX = cell.x + 5; eyeY = cell.y + 6; }
                    else if (snake.dy > 0) { eyeX = cell.x + 6; eyeY = cell.y + 13; }
                    else if (snake.dy < 0) { eyeX = cell.x + 6; eyeY = cell.y + 5; }

                    ctx.beginPath();
                    ctx.arc(eyeX, eyeY, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (cell.x === apple.x && cell.y === apple.y) {
                    snake.maxCells++;
                    const pointsGained = 10;
                    score += pointsGained;
                    pendingScore += pointsGained;

                    updateHighScore();
                    checkCoinRewards();

                    document.getElementById('score').innerText = score;
                    spawnApple();
                }
            });
        }

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();

            if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(key)) {
                e.preventDefault();
            }

            if ((key === 'arrowleft' || key === 'a') && snake.dx === 0) {
                nextDx = -grid; nextDy = 0;
            } else if ((key === 'arrowup' || key === 'w') && snake.dy === 0) {
                nextDx = 0; nextDy = -grid;
            } else if ((key === 'arrowright' || key === 'd') && snake.dx === 0) {
                nextDx = grid; nextDy = 0;
            } else if ((key === 'arrowdown' || key === 's') && snake.dy === 0) {
                nextDx = 0; nextDy = grid;
            }
        });

        respawnSnake();
        spawnApple();
        renderShop();
        window.requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
